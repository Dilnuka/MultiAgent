ai_risk_analysis_task:
  description: >
    Perform a thorough AI implementation risk analysis for {topic}, covering technical, ethical,
    and business risks. Consider model lifecycle, data quality, deployment, monitoring, and governance,
    given the current year is {current_year}. Focus on the user-provided risk scenario: {scenario}.
  expected_output: >
    A structured analysis with key risks, likelihood, impact, and mitigation strategies. Include
    at least 10 concrete risks categorized by technical, ethical, and business domains.
  agent: ai_risk_assessment_analyst

ai_compliance_research_task:
  description: >
    Identify applicable regulations, standards, and frameworks for {topic} AI systems, including
    regional and sector-specific obligations for the selected region: {region}. Consider the declared
    data use: {data_use} and the risk scenario: {scenario}. Map requirements to control areas.
  expected_output: >
    A compliance brief summarizing obligations, scope, applicability, and verification artifacts.
    Include references to regulations and standards.
  agent: ai_compliance_researcher

data_privacy_security_task:
  description: >
    Analyze data privacy and security risks for {topic} considering data use: {data_use} and scenario: {scenario}. Cover data flows,
    classification, access,
    encryption, key management, logging, monitoring, incident response, and advanced threats like
    adversarial attacks, model stealing, data poisoning, membership inference, and prompt injection.
  expected_output: >
    A detailed privacy and security assessment with a threat model, STRIDE-like view, controls,
    and prioritized recommendations. Include mappings to privacy-by-design and zero-trust principles.
  agent: data_privacy_security_specialist

scenario_risk_classification_task:
  description: >
    Analyze the provided scenario "{scenario}" for {topic} and classify it into one of three risk levels:
    HIGH, MEDIUM, or LOW. Provide a confidence score (0-100) and brief reasoning for the classification.
    Consider factors like potential impact, likelihood, data sensitivity, regulatory implications, and business impact.
    Focus on immediate actionable insights for the user.
  expected_output: >
    A JSON response with the following structure:
    {
      "risk_level": "HIGH|MEDIUM|LOW",
      "confidence_score": 85,
      "reasoning": "Brief explanation of why this risk level was assigned",
      "key_factors": ["factor1", "factor2", "factor3"],
      "immediate_concerns": ["concern1", "concern2"]
    }
  agent: ai_risk_assessment_analyst

risk_report_task:
  description: >
    Synthesize the three analyses into a concise, well-formatted professional report (around 4500 tokens)
    with clear sections: Executive Summary (75 words); Key Findings (150 words) with subsections for Technical, Ethical, and Business Risks; 
    Risk Assessment (125 words) with detailed threat analysis; Compliance and Regulatory Framework (50 words); 
    Recommendations (75 words) with prioritized actionable items; and Next Steps (25 words).
    Use proper markdown formatting with headers, bullet points, and clear structure. Tailor the report to the selected
    region {region}, declared data use {data_use}, and the risk scenario {scenario}. Focus on actionable insights
    and clear, concise language suitable for executive review. Ensure each section has substantial content and avoid
    AI-generated meta-commentary or structural references.
  expected_output: >
    A concise 300-word markdown report with detailed sections, bullet points, and professional structure. Include
    a brief executive summary, key risk findings with specific examples, prioritized recommendations with
    implementation details, and clear next steps. Ensure substantial content in each section with specific details
    rather than generic statements. Avoid AI artifacts, repetition, and meta-commentary about report structure.
  agent: risk_report_generator
